<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zoned Out: sprite preview</title>
    <style>
      body {
        margin: 0;
        padding: 16px;
        font:
          16px system-ui,
          sans-serif;
        background: #e8e4da;
        color: #1b1b2a;
      }
      body.grey .sprite {
        filter: grayscale(1);
      }
      .controls {
        display: flex;
        gap: 1rem;
        align-items: center;
        margin-bottom: 1rem;
      }
      h2 {
        font-size: 1rem;
        margin: 1.25rem 0 0.5rem;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: flex-end;
      }
      figure {
        margin: 0;
        display: grid;
        justify-items: center;
        gap: 2px;
        background: #f7f5f0;
        padding: 4px;
        border: 1px solid #d0cbc0;
      }
      figcaption {
        font-size: 11px;
        color: #555;
      }
      .sprite {
        image-rendering: pixelated;
      }
      .font .sprite {
        background: #1b1b2a;
      }
    </style>
  </head>
  <body>
    <h1>Zoned Out sprite atlas</h1>
    <p>Generated by <code>tools/art</code> (<code>pnpm art</code>). Original art, CC BY 4.0.</p>
    <div class="controls">
      <label
        >Scale
        <select id="scale">
          <option>1</option>
          <option selected>2</option>
          <option>3</option>
        </select></label
      >
      <label><input type="checkbox" id="grey" /> Greyscale</label>
    </div>
    <div id="out"></div>
    <script type="module">
      const json = await (await fetch('atlas/atlas.json')).json();
      const img = new Image();
      img.src = 'atlas/atlas.png';
      await img.decode();
      const groups = [
        ['Ground', /^(grass|sidewalk|park|forest|rock|farmland|sand|water|shore|road)/],
        [
          'Buildings (occupied)',
          /^(house\d|duplex|townhouses|lowrise\d|midrise|tower|hotel|commercial)$/,
        ],
        ['Buildings (vacant: dark windows)', /_dark$/],
        ['Construction', /^construction/],
        ['Markers and signs', /^(marker|sign)/],
        ['Icons', /^(icon|shock|badge)/],
        ['Effects and trees', /^(dust|stamp|tree)/],
        ['UI kit', /^ui_/],
        ['Font', /^font_/],
      ];
      function render() {
        const k = Number(document.getElementById('scale').value);
        const out = document.getElementById('out');
        out.textContent = '';
        for (const [title, re] of groups) {
          const names = Object.keys(json.frames).filter((n) => re.test(n));
          const h = document.createElement('h2');
          h.textContent = `${title} (${names.length})`;
          const div = document.createElement('div');
          div.className = 'group' + (title === 'Font' ? ' font' : '');
          for (const n of names) {
            const f = json.frames[n];
            const c = document.createElement('canvas');
            c.className = 'sprite';
            c.width = f.w * k;
            c.height = f.h * k;
            const ctx = c.getContext('2d');
            ctx.imageSmoothingEnabled = false;
            ctx.drawImage(img, f.x, f.y, f.w, f.h, 0, 0, f.w * k, f.h * k);
            const fig = document.createElement('figure');
            const cap = document.createElement('figcaption');
            cap.textContent = n.startsWith('font_') ? String.fromCharCode(Number(n.slice(5))) : n;
            fig.append(c, cap);
            div.append(fig);
          }
          out.append(h, div);
        }
      }
      document.getElementById('scale').onchange = render;
      document.getElementById('grey').onchange = (e) =>
        document.body.classList.toggle('grey', e.target.checked);
      render();
    </script>
  </body>
</html>
